name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Change the first two numbers here to bump the version; the last is the build number
      APP_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign with the apps' own key (key rotation from the old debug key)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: .github/scripts/sign.sh app/build/outputs/apk/release/app-release.apk app-signed.apk

      - name: Save a newly made signing key (encrypted) before publishing
        run: |
          # Only on the very first signed build. If this push fails, nothing is published,
          # so no version ever goes out signed with a key that wasn't kept.
          if [ -d signing ] && [ -n "$(git status --porcelain signing)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing
            git commit -m "Add the apps' signing key (encrypted)"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: caravan-leveller-apk
          path: app-signed.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-signed.apk "CaravanLeveller-v${APP_VERSION}.apk"
          # Release notes = the "Next" section of CHANGELOG.md
          python3 .github/scripts/changelog.py notes > notes.md
          gh release create "v${APP_VERSION}" "CaravanLeveller-v${APP_VERSION}.apk" \
            --title "Caravan Leveller v${APP_VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Update the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rename "Next" to this version in CHANGELOG.md and commit it back
          python3 .github/scripts/changelog.py stamp "${APP_VERSION}"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Changelog for v${APP_VERSION}"
            git push origin HEAD:main || echo "Changelog push skipped (main moved on)"
          fi
          # Keep every release's notes on GitHub the same as CHANGELOG.md
          for tag in $(python3 .github/scripts/changelog.py tags); do
            python3 .github/scripts/changelog.py section "$tag" > section.md
            gh release edit "$tag" --notes-file section.md >/dev/null 2>&1 || true
          done
